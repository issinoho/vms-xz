<linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#5a82ad"/><stop offset="1" stop-color="#2d5079"/></linearGradient>
<radialGradient id="glow" cx="0.45" cy="0.45" r="0.75">
